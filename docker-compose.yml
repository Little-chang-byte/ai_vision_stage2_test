services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment: &environment
      TASK_MODE: celery
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/stage3.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes: &volumes
      - ./data:/app/data
      - ./results:/app/results
      - ./yolo11n.pt:/app/yolo11n.pt:ro
    extra_hosts: &hosts
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
  worker:
    build: .
    command: celery -A src.queue_app:celery_app worker --pool=prefork --concurrency=1 --loglevel=INFO
    env_file: .env
    environment: *environment
    volumes: *volumes
    extra_hosts: *hosts
    depends_on:
      redis:
        condition: service_healthy
  nginx:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  redis-data:
