services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    image: vision-stage3:local
    env_file: ${APP_ENV_FILE:-.env}
    environment: &environment
      TASK_MODE: celery
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/stage3.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes: &volumes
      - ${APP_DATA_DIR:-./data}:/app/data
      - ${APP_RESULTS_DIR:-./results}:/app/results
      - ./yolo11n.pt:/app/yolo11n.pt:ro
    extra_hosts: &hosts
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  worker:
    build: .
    image: vision-stage3:local
    command: celery -A src.queue_app:celery_app worker --pool=prefork --concurrency=1 --loglevel=INFO
    env_file: ${APP_ENV_FILE:-.env}
    environment: *environment
    volumes: *volumes
    extra_hosts: *hosts
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  redis-data:
