<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>视觉实验室 · 双模型对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172638;font:16px system-ui}main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{margin-bottom:6px}small,.muted{color:#52647a}article{background:white;padding:24px;border-radius:14px;margin:18px 0;box-shadow:0 4px 18px #23354d0a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}button,input{font:inherit;padding:10px;border-radius:7px;border:1px solid #b7c4d5}button{cursor:pointer;background:#175cca;color:white}button:disabled{opacity:.5;cursor:wait}.secondary{background:white;color:#175cca}pre{white-space:pre-wrap;word-break:break-word;background:#f3f6fa;padding:12px;max-height:340px;overflow:auto}img{max-width:100%;max-height:380px;object-fit:contain}#message{padding:12px;white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #d8e1ec}#login input{width:220px}textarea{width:100%;min-height:70px}@media(max-width:720px){.grid{grid-template-columns:1fr}header{display:block}}
</style><main>
<header><div><h1>视觉实验室</h1><small>同一原图 · YOLO 检测与 Qwen3-VL 多模态理解</small></div><button id="logout" class="secondary" hidden>退出登录</button></header>
<article id="login"><h2>登录实验台</h2><form id="loginForm"><input id="username" placeholder="账号" autocomplete="username" required><input id="password" type="password" placeholder="密码" autocomplete="current-password" required><button>登录</button></form></article>
<div id="workspace" hidden><article><h2>上传图片</h2><p class="muted">JPG、PNG、WEBP，最大 10 MB。两种模型独立保存结果与错误。</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="clear" class="secondary">清除图片</button><button id="run">开始对比 / 重新执行</button><p id="mode"></p><img id="preview" alt="原始图片预览" hidden></article>
<article><h2>当前任务</h2><div id="status">尚未选择任务</div><div class="grid"><div><h3>YOLO</h3><p id="yoloState"></p><img id="detected" alt="YOLO真实检测框图" hidden><pre id="yolo">等待结果</pre></div><div><h3>Qwen3-VL</h3><p id="vlmState"></p><pre id="vlm">等待结果</pre></div></div><h3>类别数量比较</h3><p class="muted">按模型返回的类别名比较；— 表示该方案尚未成功，不代表零检测。</p><div id="countsTable"></div><details><summary>原始比较记录</summary><pre id="comparison">等待结果</pre></details><textarea id="note" placeholder="任务备注"></textarea><button id="saveNote" class="secondary">保存备注</button><button id="deleteTask" class="secondary">删除此任务记录</button></article>
<article><h2>历史任务</h2><button id="refresh" class="secondary">刷新历史</button><div id="history"></div></article></div><div id="message" role="alert"></div>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('token'),taskId=localStorage.getItem('taskId'),timer=null,busy=false,objectUrls=[];
function message(text){$('message').textContent=text}function stop(){if(timer)clearTimeout(timer);timer=null}function resetImages(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[]}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...(token?{Authorization:'Bearer '+token}:{}),...options.headers}});if(!r.ok){let d=await r.json().catch(()=>({detail:r.statusText}));if(r.status===401){token=null;sessionStorage.removeItem('token');stop();showLogin()}throw Error(JSON.stringify(d.detail||d))}return r.json()}
function showLogin(){$('login').hidden=!!token;$('workspace').hidden=!token;$('logout').hidden=!token}
async function authenticatedImage(kind,target){const r=await fetch('/api/tasks/'+taskId+'/image/'+kind,{headers:{Authorization:'Bearer '+token}});if(!r.ok){target.hidden=true;return}const u=URL.createObjectURL(await r.blob());objectUrls.push(u);target.src=u;target.hidden=false}
function renderCounts(t){const root=$('countsTable');root.replaceChildren();const c=t.comparison||{},a=c.yolo_counts||{},b=c.vlm_counts||{};const table=document.createElement('table');const header=table.insertRow();for(const label of ['类别','YOLO 数量','Qwen3-VL 数量','差值（YOLO − VLM）']){const th=document.createElement('th');th.textContent=label;header.append(th)}for(const name of [...new Set([...Object.keys(a),...Object.keys(b)])].sort()){const av=t.yolo_status==='success'?(a[name]||0):null,bv=t.vlm_status==='success'?(b[name]||0):null;const row=table.insertRow();for(const value of [name,av??'—',bv??'—',av!==null&&bv!==null?av-bv:'—'])row.insertCell().textContent=value}root.append(table);if(!Object.keys(a).length&&!Object.keys(b).length){const p=document.createElement('p');p.textContent=t.status==='success'?'两种模型均未检测到对象':'等待有效结果；失败详情见上方。';root.append(p)}}
async function renderTask(t){renderCounts(t);$('status').textContent=t.task_id+' | '+t.status+' | SHA-256 '+t.image_sha256;$('yoloState').textContent=t.yolo_status+' · '+(t.yolo?.runtime_seconds??'—')+' 秒';$('vlmState').textContent=t.vlm_status+' · '+(t.vlm?.runtime_seconds??'—')+' 秒';$('yolo').textContent=JSON.stringify(t.yolo,null,2);$('vlm').textContent=JSON.stringify(t.vlm,null,2);$('comparison').textContent=JSON.stringify(t.comparison,null,2);$('note').value=t.note||'';if(t.error)message(t.error)}
async function poll(){try{const t=await api('/api/tasks/'+taskId);await renderTask(t);if(['pending','running'].includes(t.status)){busy=true;$('run').disabled=true;timer=setTimeout(poll,1200)}else{busy=false;$('run').disabled=false;await authenticatedImage('yolo',$('detected'));await history()}}catch(e){stop();busy=false;$('run').disabled=false;message(e.message)}}
async function selectTask(id){stop();taskId=id;localStorage.setItem('taskId',id);resetImages();$('detected').hidden=true;message('');await authenticatedImage('original',$('preview'));await poll()}
async function history(){const rows=await api('/api/history');$('history').replaceChildren();for(const r of rows){const p=document.createElement('p'),b=document.createElement('button');b.className='secondary';b.textContent=r.created_at+' · '+r.status+' · '+r.task_id.slice(0,8);b.onclick=()=>selectTask(r.task_id).catch(e=>message(e.message));p.append(b);$('history').append(p)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.access_token;sessionStorage.setItem('token',token);$('password').value='';showLogin();message('登录成功');await history();if(taskId)await selectTask(taskId)}catch(e){message(e.message)}};
$('file').onchange=()=>{resetImages();const f=$('file').files[0];if(f){const u=URL.createObjectURL(f);objectUrls.push(u);$('preview').src=u;$('preview').hidden=false}};
$('clear').onclick=()=>{$('file').value='';$('preview').hidden=true;resetImages()};
$('run').onclick=async()=>{if(busy)return;const f=$('file').files[0];if(!f){message('请先选择图片');return}busy=true;$('run').disabled=true;stop();message('正在上传');try{const form=new FormData();form.append('file',f);const uploaded=await api('/api/upload',{method:'POST',body:form});const t=await api('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(uploaded)});message('任务已提交');await selectTask(t.task_id)}catch(e){busy=false;$('run').disabled=false;message(e.message)}};
$('refresh').onclick=()=>history().catch(e=>message(e.message));
$('saveNote').onclick=async()=>{if(!taskId)return;try{await api('/api/tasks/'+taskId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:$('note').value})});message('备注已保存')}catch(e){message(e.message)}};
$('deleteTask').onclick=async()=>{if(!taskId||!confirm('确认删除当前任务记录？原始模型文件会保留。'))return;try{await api('/api/tasks/'+taskId+'?confirm=true',{method:'DELETE'});stop();taskId=null;localStorage.removeItem('taskId');message('记录已删除');await history()}catch(e){message(e.message)}};
$('logout').onclick=()=>{stop();token=null;sessionStorage.removeItem('token');resetImages();showLogin();message('已退出登录')};
showLogin();api('/health').then(h=>{$('mode').textContent='执行模式 '+h.task_mode+(h.task_mode==='local'?'（本机串行，Redis队列未验证）':'（Redis + Celery）')}).catch(e=>message(e.message));if(token){history().then(()=>taskId&&selectTask(taskId)).catch(e=>message(e.message))}
</script></main></html>
